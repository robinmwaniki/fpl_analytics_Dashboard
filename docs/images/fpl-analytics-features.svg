<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">FPL Analytics feature previews</title><desc id="desc">Four illustrative feature panels for player analytics, player comparison, fixture difficulty planning and manager analytics.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#e9edff"/></linearGradient><linearGradient id="purple" x2="1"><stop stop-color="#5429d8"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient></defs>
<rect width="1440" height="760" rx="28" fill="url(#bg)"/><text x="64" y="82" fill="#17234a" font-family="Arial" font-size="40" font-weight="700">Explore the analytics toolkit</text><text x="66" y="120" fill="#5d6b8c" font-family="Arial" font-size="20">Illustrative previews of the dashboard's core workflows</text>
<g font-family="Arial"><rect x="55" y="165" width="640" height="250" rx="22" fill="#fff" stroke="#d9def6"/><text x="88" y="210" fill="#38218f" font-size="25" font-weight="700">01 · Player Analytics</text><text x="88" y="250" fill="#6b7592" font-size="16">Inspect form, points, value and match history</text><rect x="88" y="275" width="190" height="105" rx="14" fill="#f0edff"/><text x="108" y="312" fill="#6e58c9" font-size="14">TOTAL POINTS</text><text x="108" y="356" fill="#24195e" font-size="35" font-weight="700">212</text><rect x="305" y="275" width="355" height="105" rx="14" fill="#f8f7ff"/><path d="M325 354L365 337 405 344 445 315 485 325 525 300 565 310 605 285 640 294" fill="none" stroke="#7251e8" stroke-width="4" stroke-linecap="round"/><path d="M325 365H640" stroke="#d8d2f6"/>
<rect x="745" y="165" width="640" height="250" rx="22" fill="#fff" stroke="#d9def6"/><text x="778" y="210" fill="#38218f" font-size="25" font-weight="700">02 · Player Comparison</text><text x="778" y="250" fill="#6b7592" font-size="16">Compare two players across key FPL metrics</text><rect x="780" y="275" width="250" height="105" rx="14" fill="#f2efff"/><rect x="1090" y="275" width="250" height="105" rx="14" fill="#eef7ff"/><text x="805" y="310" fill="#6750c2" font-size="15">PLAYER A</text><text x="805" y="352" fill="#24195e" font-size="30" font-weight="700">182 pts</text><text x="1115" y="310" fill="#2675b8" font-size="15">PLAYER B</text><text x="1115" y="352" fill="#17456f" font-size="30" font-weight="700">164 pts</text><circle cx="1060" cy="328" r="22" fill="url(#purple)"/><text x="1048" y="336" fill="#fff" font-size="19" font-weight="700">VS</text>
<rect x="55" y="450" width="640" height="250" rx="22" fill="#fff" stroke="#d9def6"/><text x="88" y="495" fill="#38218f" font-size="25" font-weight="700">03 · Fixture Planner</text><text x="88" y="535" fill="#6b7592" font-size="16">Review upcoming opponents and fixture difficulty</text><g font-size="16"><g fill="#697590"><text x="100" y="590">GAMEWEEK</text><text x="260" y="590">OPPONENT</text><text x="470" y="590">DIFFICULTY</text></g><path d="M90 605H655M90 648H655" stroke="#e3e6f2"/><g fill="#25345e"><text x="100" y="633">GW 30</text><text x="260" y="633">Opponent A (H)</text><text x="490" y="633">●●</text><text x="100" y="677">GW 31</text><text x="260" y="677">Opponent B (A)</text><text x="490" y="677">●●●●</text></g></g>
